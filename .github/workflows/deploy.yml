name: Build and deploy ASP.Net Core app to Azure Web App - api-tiendavideojuegos-jp

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build with dotnet
        run: dotnet build Backend/Backend.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Backend/Backend.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Diagnostico del publish profile
        run: |
          P="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          echo "largo=${#P}"
          echo "prefijo=${P:0:15}"
          echo "perfiles=$(echo "$P" | grep -c '<publishProfile')"
          echo "tiene_zip=$(echo "$P" | grep -c 'ZipDeploy')"
          echo "bytes_raros=$(echo "$P" | tr -d '\n' | wc -c)"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-tiendavideojuegos-jp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .